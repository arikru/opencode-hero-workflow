name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: bun install
        run: bun install

      - name: bun test
        run: bun test

      - name: npm publish
        run: |
          printf "//registry.npmjs.org/:_authToken=${NPM_TOKEN}\n" > "$HOME/.npmrc"
          npm publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
